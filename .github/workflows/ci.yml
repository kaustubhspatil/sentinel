name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sentinel:
    name: sentinel (reference deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # install agentnorm from the local path
      - run: pip install -e ./packages/agentnorm
      - run: pip install -e ".[dev]"
      # only tests/, packages/ has its own job
      - name: Unit tests
        run: pytest tests -q
      - name: Lint
        run: ruff check src tests

  agentnorm:
    name: agentnorm (library)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # test the full supported python range with no extra deps
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - working-directory: packages/agentnorm
        run: pip install -e ".[dev]"
      - name: Unit tests
        working-directory: packages/agentnorm
        run: pytest -q
      - name: Lint
        working-directory: packages/agentnorm
        run: ruff check agentnorm tests
      - name: Quickstart runs
        working-directory: packages/agentnorm
        run: python examples/quickstart.py

  zero-dependency-check:
    name: agentnorm imports nothing external
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # check there are no module-level third-party imports (lazy imports are ok)
      - name: Assert no third-party imports at module scope
        working-directory: packages/agentnorm
        run: python tools/check_zero_deps.py

  quality-gate:
    name: evaluation regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pip ignores [tool.uv.sources], so install agentnorm from the path
      - run: pip install -e ./packages/agentnorm
      - run: pip install -e .
      # eval runs on the backbone, CI just checks the committed report and its age
      - name: Evaluation regression gate
        run: python -m sentinel.eval.gate
