name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sentinel:
    name: sentinel (reference deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # warden is a sibling distribution in this repo, installed from the path so the
      # reference deployment always builds against the working tree.
      - run: pip install -e ./packages/warden
      - run: pip install -e ".[dev]"
      # Scoped to tests/ - packages/ is a separate distribution with its own job, and
      # collecting it here fails on an import the root environment does not have.
      - name: Unit tests
        run: pytest tests -q
      - name: Lint
        run: ruff check src tests

  warden:
    name: warden (library)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The library claims >=3.10 support and zero dependencies; both are only true
        # if they are tested.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - working-directory: packages/warden
        run: pip install -e ".[dev]"
      - name: Unit tests
        working-directory: packages/warden
        run: pytest -q
      - name: Lint
        working-directory: packages/warden
        run: ruff check warden tests
      - name: Quickstart runs
        working-directory: packages/warden
        run: python examples/quickstart.py

  zero-dependency-check:
    name: warden imports nothing external
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The zero-dependency claim is the library's main adoption argument, so it is
      # enforced rather than asserted in prose. Lazy imports inside functions are how
      # optional adapters work and are allowed; a module-scope import is not.
      - name: Assert no third-party imports at module scope
        working-directory: packages/warden
        run: python tools/check_zero_deps.py

  quality-gate:
    name: evaluation regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # sentinel depends on warden, which is a sibling in this repo rather than a
      # release. pip does not read [tool.uv.sources], so the path install is explicit.
      - run: pip install -e ./packages/warden
      - run: pip install -e .
      # The evaluation itself runs on the backbone, which holds the graph and is
      # reachable only from the operator's IP. CI enforces the committed report's
      # thresholds, including its age, so a stale pass cannot masquerade as fresh.
      - name: Evaluation regression gate
        run: python -m sentinel.eval.gate
