name: ingest-public-feeds

# runs on GH schedule so EPSS keeps collecting even if the backbone is down
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Fetch KEV, EPSS and ATT&CK
        run: python -m sentinel.ingest.feeds
      - uses: actions/upload-artifact@v4
        with:
          name: feeds-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
