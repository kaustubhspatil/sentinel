[project]
name = "sentinel"
version = "0.1.0"
description = "An agentic IT-operations intelligence fabric with a model-validation layer for its own agents."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "neo4j>=5.23",
    "clickhouse-connect>=0.7",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "temporalio>=1.7",
    "google-auth>=2.30",
    "agentnorm",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# agentnorm installed from the local path
[tool.uv.sources]
agentnorm = { path = "packages/agentnorm" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# standard rule set: E, F, I, UP, B
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # function call in argument default: intentional for FastMCP-style tools
]
