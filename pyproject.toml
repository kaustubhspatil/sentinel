[project]
name = "sentinel"
version = "0.1.0"
description = "An agentic IT-operations intelligence fabric with a model-validation layer for its own agents."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "neo4j>=5.23",
    "clickhouse-connect>=0.7",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "temporalio>=1.7",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
