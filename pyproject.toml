[project]
name = "sentinel"
version = "0.1.0"
description = "An agentic IT-operations intelligence fabric with a model-validation layer for its own agents."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "neo4j>=5.23",
    "clickhouse-connect>=0.7",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "temporalio>=1.7",
    "google-auth>=2.30",
    "agentnorm",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# agentnorm lives in this repo as a separate distribution; installed from the path so the
# reference deployment always builds against the working tree rather than a release.
[tool.uv.sources]
agentnorm = { path = "packages/agentnorm" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# An explicit, conventional selection: pycodestyle errors, pyflakes, import order,
# pyupgrade and bugbear. Deliberately not the everything-set - a lint gate that reports
# stylistic preferences alongside real defects trains people to ignore it.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # function call in argument default: intentional for FastMCP-style tools
]
