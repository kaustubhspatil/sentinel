[project]
name = "warden-agents"
version = "0.1.0"
description = "Behavioural monitoring for AI agents: runtime baselines, scope enforcement and cold-start-safe anomaly detection."
requires-python = ">=3.10"
dependencies = []          # deliberately none - see README
license = { text = "MIT" }
keywords = ["agents", "llm", "observability", "anomaly-detection", "ai-safety"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # UP017 rewrites datetime.timezone.utc to datetime.UTC, which does not exist before
    # Python 3.11. This package supports 3.10, and the CI matrix catches it - but the
    # linter should not keep reintroducing it.
    "UP017",
]
